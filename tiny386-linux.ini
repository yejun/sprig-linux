; Machine settings for Sprig Linux (kernel and root file system in /linux on the card)
[pc]
linuxstart = /sdcard/linux/linuxstart.bin
kernel = /sdcard/linux/bzImage
cmdline = console=tty0 root=/dev/sda rw ne.io=0x300 ne.irq=9 pata_legacy.probe_mask=1
hda = /sdcard/linux/root.img
mem_size = 18M
vga_mem_size = 256K
fill_cmos = 1

[cpu]
gen = 5
fpu = 1
