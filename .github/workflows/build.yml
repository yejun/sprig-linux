# Builds Sprig Linux: by hand (Actions, "Run workflow": the release's files, sources included, as an artifact for a
# few days), or for a version tag (git tag v0.1 && git push origin v0.1: a draft release to look over and publish)
name: Build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  RELEASE: 1   # (every source unpacked anew; package.sh checks it)
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # (the version from the tags)
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-multilib flex bison bc libelf-dev fakeroot e2fsprogs autoconf automake \
            libtool ncurses-bin
      - name: Downloads (kept between runs)
        uses: actions/cache@v6
        with:
          path: work/dl
          key: dl-${{ hashFiles('build.sh', 'extras.sh', 'tools/fetch.sh') }}
          restore-keys: dl-
      - name: Programs beyond BusyBox
        run: ./extras.sh
      - name: Kernels, loader, root file system
        run: FB=1 ./build.sh
      - name: Package
        run: ./package.sh
      - name: Release's files (by hand; with the sources, so that shared images have them too)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: sprig-linux-${{ github.sha }}
          path: release/*
          retention-days: 3
      - name: Draft release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --draft --title "Sprig Linux $GITHUB_REF_NAME" \
            --notes "Kernels (bzImage: text console, bzImage-fb: graphics console), loader, root file system (root.img.gz: decompress it before use), settings, what it was built from (BUILDINFO), third-party notices and licences, and the sources. See the README for installing."
