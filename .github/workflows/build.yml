# Builds Sprig Linux: by hand (Actions, "Run workflow": the images as an artifact for a few days), or for a version
# tag (git tag v0.1 && git push origin v0.1: a draft release with the images and the sources, to look over and publish)
name: Build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  ZIG: 0.17.0
  ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # (the version from the tags)
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-multilib flex bison bc libelf-dev fakeroot e2fsprogs autoconf automake \
            libtool ncurses-bin
          curl -sSfL -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$ZIG/zig-x86_64-linux-$ZIG.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-$ZIG" >> "$GITHUB_PATH"
      - name: Downloads (kept between runs)
        uses: actions/cache@v4
        with:
          path: work/dl
          key: dl-${{ hashFiles('build.sh', 'extras.sh') }}
          restore-keys: dl-
      - name: Programs beyond BusyBox
        run: ./extras.sh
      - name: Kernels, loader, root file system
        run: FB=1 ./build.sh
      - name: Package
        run: ./package.sh
      - name: Images (by hand)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sprig-linux-images
          path: |
            release/*
            !release/*-sources.tar
          retention-days: 5
      - name: Draft release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --draft --title "Sprig Linux $GITHUB_REF_NAME" \
            --notes "Kernels (bzImage: text console, bzImage-fb: graphics console), loader, root file system (root.img.gz), settings, and the sources they were built from. See the README for installing."
